# Gera uma URL de pré-visualização no Firebase Hosting para cada pull request.
name: Pré-visualização no Firebase Hosting (pull request)

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/939838888818/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-1376082611@apresentacao-fish-ad.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publicar canal de pré-visualização
        id: preview
        run: |
          npx firebase-tools@15.22.1 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project apresentacao-fish-ad --expires 7d --non-interactive --json > result.json
          echo "url=$(node -e 'const r=require("./result.json");console.log(Object.values(r.result)[0].url)')" >> "$GITHUB_OUTPUT"

      - name: Comentar a URL no pull request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Pré-visualização publicada: ${{ steps.preview.outputs.url }}`
            })
